<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Jeu des references — Zoom & Loupe</title>
  <style>
    * {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    :root {
      --bg-1: #080d14;
      --bg-2: #0f1a27;
      --glass: rgba(9, 16, 25, 0.72);
      --line: rgba(176, 210, 240, 0.25);
      --text: #eef6ff;
      --accent: #5af0b2;
      --danger: #ff7474;
      --verified-icon-size: 34px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background: radial-gradient(120% 90% at 50% 40%, #1a2a3f 0%, transparent 55%),
                  radial-gradient(80% 60% at 20% 90%, #123046 0%, transparent 62%),
                  linear-gradient(160deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.44) 100%);
      z-index: 0;
    }

    /* STAGE */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      cursor: none;
    }

    /* WRAPPER ZOOM/PAN — positionné en absolu, centré via JS */
    #zoomPan {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }

    #gameImage {
      display: block;
      pointer-events: none;
      box-shadow: 0 18px 42px rgba(0,0,0,0.5);
      border-left:  1px solid rgba(255,255,255,0.08);
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    /* Zones cliquables */
    .hit-zone {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 5;
    }
    .hit-zone:focus-visible {
      outline: 2px dashed rgba(255,255,255,0.9);
      outline-offset: 4px;
    }
    body.debug .hit-zone {
      background: rgba(255,195,0,0.25);
      border: 2px dashed rgba(255,220,120,0.95);
      border-radius: 12%;
    }
    .hit-zone.found::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: var(--verified-icon-size);
      height: var(--verified-icon-size);
      transform: translate(-50%,-50%) scale(0.25) rotate(-9deg);
      border-radius: 50%;
      background: url("verifie.png") center / contain no-repeat;
      filter: drop-shadow(0 0 12px rgba(90,240,178,0.9));
      animation: stamp 420ms cubic-bezier(0.2,1.2,0.2,1) forwards;
      pointer-events: none;
    }

    /* Curseur personnalisé */
    .custom-cursor {
      position: fixed;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(90,240,178,0.9);
      border-radius: 50%;
      background: rgba(90,240,178,0.15);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 6px #5af0b2;
    }

    /* badge réponse validée */
    .zone-answer {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translate(-50%,8px) scale(0.96);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(7,14,24,0.96);
      border: 1px solid rgba(206,228,255,0.5);
      color: #f4fbff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      backdrop-filter: blur(4px);
    }
    .zone-answer.show {
      animation: answer-fade 3000ms ease forwards;
    }

    /* HUD */
    .hud {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      font-size: clamp(14px,2vw,20px);
      font-weight: 700;
      letter-spacing: 0.2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-family: monospace;
    }
    .hud-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: linear-gradient(180deg,#9effd7,#2ec98f);
      box-shadow: 0 0 10px rgba(90,240,178,0.8);
    }

    /* panneau debug */
    .mapper {
      position: fixed;
      top: 12px; right: 12px;
      z-index: 20;
      padding: 8px 14px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      max-width: min(92vw,560px);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      font-family: monospace;
    }
    body.debug .mapper {
      opacity: 1;
      transform: translateY(0);
    }

    /* Overlay réponse */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3,8,15,0.65);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 240ms ease, visibility 0s linear 240ms;
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 240ms ease;
    }
    .answer-box {
      width: min(560px,90vw);
      padding: 10px;
      border-radius: 999px;
      background: linear-gradient(140deg,rgba(11,20,32,0.94),rgba(20,30,45,0.9));
      border: 1px solid rgba(206,228,255,0.45);
      box-shadow: 0 26px 60px rgba(0,0,0,0.5);
      transform: translateY(14px) scale(0.95);
      transition: transform 260ms cubic-bezier(0.18,1,0.2,1);
    }
    .overlay.active .answer-box {
      transform: translateY(0) scale(1);
    }
    #answerInput {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: rgba(7,14,24,0.92);
      color: #f4fbff;
      padding: 16px 22px;
      font-size: clamp(20px,3.8vw,36px);
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: box-shadow 180ms ease;
    }
    #answerInput:focus {
      box-shadow: 0 0 0 2px rgba(90,240,178,0.7);
      background: rgba(9,18,30,0.96);
    }
    #answerInput.invalid {
      box-shadow: 0 0 0 2px rgba(255,116,116,0.8);
      animation: nudge 280ms ease;
    }

    /* FINISH */
    .finish-screen {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: grid;
      place-items: center;
      background: rgba(3,8,15,0.75);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }
    .finish-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 320ms ease;
    }
    .finish-card {
      width: min(620px,92vw);
      padding: clamp(24px,4vw,40px);
      border-radius: 32px;
      text-align: center;
      background: linear-gradient(140deg,rgba(13,24,37,0.96),rgba(20,35,52,0.92));
      border: 1px solid rgba(210,232,255,0.4);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: finish-pop 600ms cubic-bezier(0.2,1.1,0.2,1) forwards;
    }
    .finish-title {
      margin: 0 0 8px;
      font-size: clamp(32px,6vw,58px);
      color: #5af0b2;
    }

    /* Loupe */
    .magnifier {
      position: fixed;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid rgba(90,240,178,0.9);
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 10000;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.3), 0 0 0 8px rgba(90,240,178,0.2);
      transform: translate(-50%,-50%);
    }

    /* Animations */
    @keyframes stamp {
      0%   { opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(-12deg); }
      70%  { opacity:1; transform:translate(-50%,-50%) scale(1.1) rotate(2deg); }
      100% { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    }
    @keyframes nudge {
      0%,100% { transform:translateX(0); }
      30%     { transform:translateX(-6px); }
      60%     { transform:translateX(6px); }
    }
    @keyframes finish-pop {
      from { opacity:0; transform:scale(0.92) translateY(20px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    @keyframes answer-fade {
      0%   { opacity:0; transform:translate(-50%,8px) scale(0.96); }
      15%  { opacity:1; transform:translate(-50%,0) scale(1); }
      80%  { opacity:1; transform:translate(-50%,0) scale(1); }
      100% { opacity:0; transform:translate(-50%,-6px) scale(0.97); }
    }

    @media (max-width:820px) {
      .hud { left:8px; bottom:8px; padding:6px 12px; }
      .magnifier { width:150px; height:150px; }
    }
  </style>
</head>

    // ─── DOM ────────────────────────────────────────────────────────────────────
    const stage       = document.getElementById("stage");
    const zoomPan     = document.getElementById("zoomPan");
    const gameImg     = document.getElementById("gameImage");
    const overlayDiv  = document.getElementById("overlay");
    const finishDiv   = document.getElementById("finishScreen");
    const answerInput = document.getElementById("answerInput");
    const counterSpan = document.getElementById("counterText");
    const mapperDiv   = document.getElementById("mapper");
    const cursorDiv   = document.getElementById("customCursor");
    const successSound = new Audio("success.mp3");
    successSound.volume = 0.3; // optionnel (0 à 1)

    // ─── ÉTAT ZOOM/PAN ──────────────────────────────────────────────────────────
    // On stocke : scale + offset (ox, oy) = translation en px du coin haut-gauche
    // de l'image par rapport au coin haut-gauche du viewport.
    // À scale=1, l'image est centrée, donc ox = (winW - imgW) / 2, oy = (winH - imgH) / 2.
    let scale  = 1;
    let ox     = 0;   // offset X du coin top-left de l'image dans le viewport
    let oy     = 0;   // offset Y du coin top-left de l'image dans le viewport
    let imgW   = 0;   // largeur rendue à scale=1
    let imgH   = 0;   // hauteur rendue à scale=1

    function applyTransform() {
      zoomPan.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`;
    }

    function clampOffsets() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const scaledW = imgW * scale;
      const scaledH = imgH * scale;

      if (scaledW <= winW) {
        // Image moins large que l'écran → centrer
        ox = (winW - scaledW) / 2;
      } else {
        ox = Math.min(0, Math.max(winW - scaledW, ox));
      }

      if (scaledH <= winH) {
        // Image moins haute que l'écran → centrer
        oy = (winH - scaledH) / 2;
      } else {
        oy = Math.min(0, Math.max(winH - scaledH, oy));
      }
    }

    // ─── ZOOM (molette) ─────────────────────────────────────────────────────────
    function handleWheel(e) {
      e.preventDefault();

      const factor   = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const newScale = Math.min(6, Math.max(1, scale * factor));
      if (newScale === scale) return;

      // Point fixe = position souris dans le viewport
      const mx = e.clientX;
      const my = e.clientY;

      // Position souris dans l'image à l'échelle actuelle
      // mx = ox + imgX * scale  →  imgX = (mx - ox) / scale
      const imgX = (mx - ox) / scale;
      const imgY = (my - oy) / scale;

      scale = newScale;

      // Recalculer l'offset pour que le même point de l'image reste sous le curseur
      // mx = ox_new + imgX * scale  →  ox_new = mx - imgX * scale
      ox = mx - imgX * scale;
      oy = my - imgY * scale;

      clampOffsets();
      applyTransform();
    }

    // ─── PAN (drag) ─────────────────────────────────────────────────────────────
    let isDragging   = false;
    let dragStartMX  = 0, dragStartMY  = 0;
    let dragStartOX  = 0, dragStartOY  = 0;
    let didDrag      = false;

    function startDrag(e) {
      if (scale <= 1) return;
      isDragging  = true;
      didDrag     = false;
      dragStartMX = e.clientX;
      dragStartMY = e.clientY;
      dragStartOX = ox;
      dragStartOY = oy;
      stage.style.cursor = "grabbing";
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!isDragging) return;
      const dx = e.clientX - dragStartMX;
      const dy = e.clientY - dragStartMY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) didDrag = true;
      ox = dragStartOX + dx;
      oy = dragStartOY + dy;
      clampOffsets();
      applyTransform();
    }

    function stopDrag() {
      isDragging = false;
      stage.style.cursor = "none";
    }

    // ─── RESET ZOOM (double-clic) ────────────────────────────────────────────
    function resetZoom() {
      scale = 1;
      centerImage();
      applyTransform();
    }

    function centerImage() {
      ox = (window.innerWidth  - imgW) / 2;
      oy = (window.innerHeight - imgH) / 2;
    }

    // ─── LOUPE (clic droit) ──────────────────────────────────────────────────
    // La loupe montre l'image zoomée × MAGNIFIER_ZOOM, centrée sur le point pointé.
    const MAGNIFIER_SIZE = 200;
    const MAGNIFIER_ZOOM = 2.5;
    let magnifier = null;

    function showMagnifier(e) {
      e.preventDefault();
      removeMagnifier();

      magnifier = document.createElement("div");
      magnifier.className = "magnifier";
      magnifier.style.width  = MAGNIFIER_SIZE + "px";
      magnifier.style.height = MAGNIFIER_SIZE + "px";
      document.body.appendChild(magnifier);

      function updateMagnifier(ev) {
        if (!magnifier) return;

        const mx = ev.clientX;
        const my = ev.clientY;

        // Coordonnée dans l'image naturelle correspondant au pixel sous le curseur
        // ox + imgX * scale = mx  →  imgX = (mx - ox) / scale
        const imgX = (mx - ox) / scale;
        const imgY = (my - oy) / scale;

        // La loupe affiche l'image à MAGNIFIER_ZOOM (indépendant du scale actuel),
        // et on veut que imgX,imgY soit au centre de la loupe.
        const bgW = gameImg.naturalWidth  * MAGNIFIER_ZOOM;
        const bgH = gameImg.naturalHeight * MAGNIFIER_ZOOM;
        const bgX = -(imgX * MAGNIFIER_ZOOM - MAGNIFIER_SIZE / 2);
        const bgY = -(imgY * MAGNIFIER_ZOOM - MAGNIFIER_SIZE / 2);

        magnifier.style.left = mx + "px";
        magnifier.style.top  = my + "px";
        magnifier.style.backgroundImage    = `url(${gameImg.src})`;
        magnifier.style.backgroundSize     = `${bgW}px ${bgH}px`;
        magnifier.style.backgroundPosition = `${bgX}px ${bgY}px`;
      }

      updateMagnifier(e);

      const onMove = (ev) => updateMagnifier(ev);
      const onEnd  = () => removeMagnifier();
      const onKey  = (ev) => { if (ev.key === "Escape") removeMagnifier(); };

      document.addEventListener("mousemove", onMove);
      document.addEventListener("click",     onEnd);
      document.addEventListener("keydown",   onKey);

      magnifier._cleanup = () => {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("click",     onEnd);
        document.removeEventListener("keydown",   onKey);
      };
    }

    function removeMagnifier() {
      if (magnifier) {
        if (magnifier._cleanup) magnifier._cleanup();
        magnifier.remove();
        magnifier = null;
      }
    }

    // ─── ZONES CLIQUABLES ────────────────────────────────────────────────────
    const zoneMap = new Map();
    let targets   = [];
    let foundCount = 0;

    function createZones() {
      for (const t of targets) {
        const btn = document.createElement("button");
        btn.className = "hit-zone";
        btn.dataset.id = t.id;
        btn.style.left         = `${t.x}%`;
        btn.style.top          = `${t.y}%`;
        btn.style.width        = `${t.w}%`;
        btn.style.height       = `${t.h}%`;
        btn.style.borderRadius = (t.shape === "square") ? "12%" : "50%";
        btn.setAttribute("aria-label", t.label);
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (didDrag) return; // pas un vrai clic
          if (t.found) showAnswerBadge(t);
          else         openOverlay(t);
        });
        zoomPan.appendChild(btn);
        zoneMap.set(t.id, btn);
      }
    }

    function showAnswerBadge(target) {
      const zone = zoneMap.get(target.id);
      if (!zone) return;
      let badge = zone.querySelector(".zone-answer");
      if (!badge) {
        badge = document.createElement("span");
        badge.className = "zone-answer";
        zone.appendChild(badge);
      }
      badge.textContent = target.answers[0] || target.label;
      badge.classList.remove("show");
      void badge.offsetWidth;
      badge.classList.add("show");
      if (window._answerTimer) clearTimeout(window._answerTimer);
      window._answerTimer = setTimeout(() => badge.classList.remove("show"), 2800);
    }

    // ─── OVERLAY RÉPONSE ─────────────────────────────────────────────────────
    let activeTarget = null;

    function openOverlay(target) {
      if (target.found) return;
      activeTarget = target;
      overlayDiv.classList.add("active");
      answerInput.value = "";
      answerInput.classList.remove("invalid");
      answerInput.placeholder = "Nom du jeu...";
      setTimeout(() => answerInput.focus(), 30);
    }

    function closeOverlay() {
      overlayDiv.classList.remove("active");
      activeTarget = null;
    }

    function markFound(target) {
      if (target.found) return;
      successSound.currentTime = 0; // permet de rejouer instantanément
      successSound.play();
      const zone = zoneMap.get(target.id);
      if (!zone) return;
      target.found = true;
      zone.classList.add("found");
      foundCount++;
      counterSpan.textContent = `Trouvés: ${foundCount} / ${targets.length}`;
      closeOverlay();
      if (foundCount === targets.length) finishDiv.classList.add("active");
    }

    function normalize(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
    }

    // ─── MODE DEBUG ───────────────────────────────────────────────────────────
    let debugMode = false;

    function enableDebugClicks() {
      zoomPan.addEventListener("click", async (e) => {
        if (!debugMode) return;
        if (e.target !== zoomPan && e.target !== gameImg) return;
        // Coordonnée dans l'image naturelle
        const imgX = (e.clientX - ox) / scale;
        const imgY = (e.clientY - oy) / scale;
        const xPct = (imgX / imgW * 100).toFixed(2);
        const yPct = (imgY / imgH * 100).toFixed(2);
        const text = `x: ${xPct}, y: ${yPct}`;
        let copied = false;
        try { await navigator.clipboard.writeText(text); copied = true; } catch {}
        mapperDiv.textContent = `Mode debug ON\n${text}\n${copied?"✅ Copié":"❌ échec copie"}\n{ x: ${xPct}, y: ${yPct}, w: 5, h: 5 }`;
      });
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    function initGame() {
      // Dimensions rendues (respectent max-width/max-height 100vw/100vh via CSS)
      // On laisse l'image prendre sa taille naturelle et on la contrôle via style
      imgW = gameImg.naturalWidth;
      imgH = gameImg.naturalHeight;

      // Redimensionner l'image pour qu'elle tienne dans le viewport
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const ratio = Math.min(winW / imgW, winH / imgH, 1); // pas d'upscale
      imgW = Math.round(imgW * ratio);
      imgH = Math.round(imgH * ratio);
      gameImg.style.width  = imgW + "px";
      gameImg.style.height = imgH + "px";

      // Position initiale : centré
      zoomPan.style.transformOrigin = "0 0";
      centerImage();
      applyTransform();

      // Zones
      targets = targetsData.map(t => ({ ...t, found: false, normalizedAnswers: t.answers.map(normalize) }));
      createZones();
      counterSpan.textContent = `Trouvés: 0 / ${targets.length}`;

      // Events zoom/pan
      stage.addEventListener("wheel",       handleWheel, { passive: false });
      stage.addEventListener("mousedown",   startDrag);
      window.addEventListener("mousemove",  moveDrag);
      window.addEventListener("mouseup",    stopDrag);
      stage.addEventListener("dblclick",    resetZoom);
      zoomPan.addEventListener("contextmenu", showMagnifier);

      // Curseur custom
      document.addEventListener("mousemove", (e) => {
        cursorDiv.style.left = e.clientX + "px";
        cursorDiv.style.top  = e.clientY + "px";
      });
      document.addEventListener("mouseleave", () => cursorDiv.style.opacity = "0");
      document.addEventListener("mouseenter", () => cursorDiv.style.opacity = "1");

      // Overlay
      answerInput.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || !activeTarget) return;
        const val   = normalize(answerInput.value);
        const match = activeTarget.normalizedAnswers.includes(val);
        if (match) {
          markFound(activeTarget);
        } else {
          answerInput.classList.add("invalid");
          answerInput.value = "";
          answerInput.placeholder = "Mauvaise réponse...";
          setTimeout(() => {
            answerInput.classList.remove("invalid");
            answerInput.placeholder = "Nom du jeu...";
          }, 800);
        }
      });
      overlayDiv.addEventListener("click", (e) => { if (e.target === overlayDiv) closeOverlay(); });
      finishDiv.addEventListener("click",  () => finishDiv.classList.remove("active"));

      // Clavier
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overlayDiv.classList.contains("active")) closeOverlay();
        if (e.key === "²") {
          debugMode = !debugMode;
          document.body.classList.toggle("debug", debugMode);
          mapperDiv.textContent = debugMode
            ? "Mode debug ON\nClique sur l'image → coordonnées %"
            : "Mode debug OFF (²)";
        }
      });

      // Redimensionnement fenêtre
      window.addEventListener("resize", () => {
        const nW = window.innerWidth;
        const nH = window.innerHeight;
        const r  = Math.min(nW / gameImg.naturalWidth, nH / gameImg.naturalHeight, 1);
        imgW = Math.round(gameImg.naturalWidth  * r);
        imgH = Math.round(gameImg.naturalHeight * r);
        gameImg.style.width  = imgW + "px";
        gameImg.style.height = imgH + "px";
        clampOffsets();
        applyTransform();
      });

      enableDebugClicks();
    }

    gameImg.onload = initGame;
    if (gameImg.complete && gameImg.naturalWidth) initGame();
  </script>
</body>
</html>
