<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeu des references</title>
  <style>
    :root {
      --bg-1: #080d14;
      --bg-2: #0f1a27;
      --glass: rgba(9, 16, 25, 0.64);
      --line: rgba(176, 210, 240, 0.25);
      --text: #eef6ff;
      --accent: #5af0b2;
      --danger: #ff7474;
      --verified-icon-size: 34px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(120% 90% at 50% 40%, #1a2a3f 0%, transparent 55%),
        radial-gradient(80% 60% at 20% 90%, #123046 0%, transparent 62%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.44) 100%);
      z-index: 0;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .image-wrap {
      position: relative;
      height: 100vh;
      width: fit-content;
      max-width: none;
      animation: soft-in 650ms ease both;
    }

    #gameImage {
      height: 100%;
      width: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
    }

    .hit-zone {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 5;
      touch-action: manipulation;
    }

    .hit-zone:focus-visible {
      outline: 2px dashed rgba(255, 255, 255, 0.9);
      outline-offset: 4px;
    }

    body.debug .hit-zone {
      background: rgba(255, 195, 0, 0.2);
      border: 2px dashed rgba(255, 220, 120, 0.95);
    }

    .hit-zone.found::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: var(--verified-icon-size);
      height: var(--verified-icon-size);
      transform: translate(-50%, -50%) scale(0.25) rotate(-9deg);
      border-radius: 50%;
      background: url("verifie.png") center / contain no-repeat;
      filter: drop-shadow(0 0 12px rgba(90, 240, 178, 0.9));
      animation: stamp 420ms cubic-bezier(0.2, 1.2, 0.2, 1) forwards;
      pointer-events: none;
    }

    .hit-zone.found {
      cursor: pointer;
    }

    .zone-answer {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translate(-50%, 8px) scale(0.96);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(7, 14, 24, 0.94);
      border: 1px solid rgba(206, 228, 255, 0.4);
      color: #f4fbff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }

    .zone-answer.show {
      animation: answer-fade 3000ms ease forwards;
    }

    .hud {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 700;
      letter-spacing: 0.2px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: soft-in 850ms ease both;
    }

    .hud-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(180deg, #9effd7, #2ec98f);
      box-shadow: 0 0 10px rgba(90, 240, 178, 0.8);
    }

    .mapper {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      max-width: min(92vw, 560px);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    body.debug .mapper {
      opacity: 1;
      transform: translateY(0);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 8, 15, 0.55);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 240ms ease, visibility 0s linear 240ms;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 240ms ease;
    }

    .finish-screen {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 8, 15, 0.68);
      backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 320ms ease, visibility 0s linear 320ms;
    }

    .finish-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 320ms ease;
    }

    .finish-card {
      position: relative;
      width: min(620px, 92vw);
      padding: clamp(24px, 4vw, 38px);
      border-radius: 24px;
      text-align: center;
      color: #f4fcff;
      border: 1px solid rgba(210, 232, 255, 0.35);
      background: linear-gradient(140deg, rgba(13, 24, 37, 0.92), rgba(20, 35, 52, 0.88));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transform: translateY(14px) scale(0.93);
    }

    .finish-screen.active .finish-card {
      animation: finish-pop 600ms cubic-bezier(0.2, 1.1, 0.2, 1) forwards;
    }

    .finish-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: conic-gradient(from 30deg, transparent 0deg 280deg, rgba(90, 240, 178, 0.55) 320deg 360deg);
      filter: blur(14px);
      opacity: 0.7;
      animation: spin 6s linear infinite;
      pointer-events: none;
    }

    .finish-title {
      position: relative;
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 56px);
      line-height: 1.05;
      letter-spacing: 0.3px;
    }

    .finish-sub {
      position: relative;
      margin: 0;
      font-size: clamp(14px, 2.2vw, 20px);
      color: rgba(222, 241, 255, 0.95);
    }

    .answer-box {
      width: min(560px, 90vw);
      padding: 10px;
      border-radius: 999px;
      background: linear-gradient(140deg, rgba(11, 20, 32, 0.88), rgba(20, 30, 45, 0.84));
      border: 1px solid rgba(206, 228, 255, 0.35);
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.45);
      transform: translateY(14px) scale(0.95);
      transition: transform 260ms cubic-bezier(0.18, 1, 0.2, 1);
    }

    .overlay.active .answer-box {
      transform: translateY(0) scale(1);
    }

    #answerInput {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: rgba(7, 14, 24, 0.92);
      color: #f4fbff;
      padding: 16px 22px;
      font-size: clamp(20px, 3.8vw, 36px);
      font-weight: 700;
      letter-spacing: 0.2px;
      text-align: center;
      outline: none;
      transition: box-shadow 180ms ease, background 180ms ease;
    }

    #answerInput::placeholder {
      color: rgba(201, 220, 240, 0.72);
      font-weight: 600;
    }

    #answerInput:focus {
      box-shadow: 0 0 0 2px rgba(90, 240, 178, 0.7);
      background: rgba(9, 18, 30, 0.96);
    }

    #answerInput.invalid {
      box-shadow: 0 0 0 2px rgba(255, 116, 116, 0.72);
      animation: nudge 280ms ease;
    }

    @keyframes soft-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes stamp {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.25) rotate(-9deg);
      }
      70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.12) rotate(3deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    @keyframes nudge {
      0% { transform: translateX(0); }
      30% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }

    @keyframes finish-pop {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.9);
      }
      70% {
        opacity: 1;
        transform: translateY(-2px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes answer-fade {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.96);
      }
      12% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      78% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -6px) scale(0.97);
      }
    }

    @media (max-width: 820px) {
      .hud {
        left: 10px;
        bottom: 10px;
        padding: 8px 11px;
      }

      .answer-box {
        width: min(520px, 92vw);
      }

      #answerInput {
        padding: 14px 18px;
      }
    }
  </style>

    function normalize(value) {
      return value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function updateCounter() {
      counterText.textContent = `Trouvés: ${foundCount} / ${targets.length}`;
    }

    function updateMapper(text) {
      mapper.textContent = text;
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const temp = document.createElement("textarea");
      temp.value = text;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);
      temp.select();

      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (error) {
        copied = false;
      }

      document.body.removeChild(temp);
      return copied;
    }

      overlay.setAttribute("aria-hidden", "true");
      answerInput.value = "";
      answerInput.classList.remove("invalid");
      answerInput.placeholder = "Ta réponse...";
      activeTarget = null;
    }

    function openOverlay(target) {
      if (target.found) {
        return;
      }

      activeTarget = target;
      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      answerInput.value = "";
      answerInput.classList.remove("invalid");
      answerInput.placeholder = "Ta réponse...";
      setTimeout(() => answerInput.focus(), 30);
    }

    function markFound(target) {
      const zone = zoneById.get(target.id);
      if (!zone || target.found) {
        return;
      }

      target.found = true;
      zone.classList.add("found");
      zone.setAttribute("aria-label", `${target.label} trouve`);
      foundCount += 1;
      updateCounter();
      closeOverlay();
      checkGameComplete();
    }

    function checkGameComplete() {
      if (foundCount !== targets.length) {
        return;
      }
      finishScreen.classList.add("active");
      finishScreen.setAttribute("aria-hidden", "false");
    }

    function showFoundAnswer(target) {
      const zone = zoneById.get(target.id);
      if (!zone) {
        return;
      }

      let badge = zone.querySelector(".zone-answer");
      if (!badge) {
        badge = document.createElement("span");
        badge.className = "zone-answer";
        zone.appendChild(badge);
      }

      badge.textContent = target.answers[0] || target.label || "Reponse";
      badge.classList.remove("show");
      void badge.offsetWidth;
      badge.classList.add("show");

      const previousTimer = answerHideTimers.get(target.id);
      if (previousTimer) {
        clearTimeout(previousTimer);
      }

      const timer = setTimeout(() => {
        badge.classList.remove("show");
        answerHideTimers.delete(target.id);
      }, 3000);

      answerHideTimers.set(target.id, timer);
    }

    function toggleDebugMode() {
      debugMode = !debugMode;
      document.body.classList.toggle("debug", debugMode);

      if (debugMode) {
        updateMapper("Mode debug ON\nClique sur l'image pour les coordonnees x/y en %\nCopie-colle ensuite dans targets[]");
      }
    }

    function createZone(target) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "hit-zone";
      btn.dataset.targetId = target.id;
      const width = target.w ?? (target.r != null ? target.r * 2 : 8);
      const height = target.h ?? (target.r != null ? target.r * 2 : 8);
      const shape = zoneShapeMode === "target" ? (target.shape ?? "ellipse") : zoneShapeMode;
      btn.style.left = `${target.x}%`;
      btn.style.top = `${target.y}%`;
      btn.style.width = `${width}%`;
      btn.style.height = `${height}%`;
      btn.style.borderRadius = shape === "square" ? "12%" : "50%";
      btn.setAttribute("aria-label", `Zone a trouver: ${target.label}`);
      btn.addEventListener("click", () => {
        if (target.found) {
          showFoundAnswer(target);
          return;
        }
        openOverlay(target);
      });

      imageWrap.appendChild(btn);
      zoneById.set(target.id, btn);
    }

    function handleWrongAnswer() {
      answerInput.classList.remove("invalid");
      void answerInput.offsetWidth;
      answerInput.classList.add("invalid");
      answerInput.value = "";
      answerInput.placeholder = "Non...";
      answerInput.focus();
    }

    targets.forEach((target) => {
      target.found = false;
      target.normalizedAnswers = target.answers.map(normalize);
      createZone(target);
    });

    answerInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || !activeTarget) {
        return;
      }

      const value = normalize(answerInput.value);
      const ok = activeTarget.normalizedAnswers.includes(value);

      if (ok) {
        markFound(activeTarget);
      } else {
        handleWrongAnswer();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && overlay.classList.contains("active")) {
        closeOverlay();
      }

      if (event.key.toLowerCase() === "²") {
        toggleDebugMode();
      }
    });

    imageWrap.addEventListener("click", async (event) => {
      if (!debugMode) {
        return;
      }

      const rect = imageWrap.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;

      const xText = x.toFixed(2);
      const yText = y.toFixed(2);
      const coordText = `x: ${xText}, y: ${yText}`;
      const copied = await copyTextToClipboard(coordText);
      const copyStatus = copied ? "Coordonnees copiees dans le presse-papiers" : "Impossible de copier automatiquement";

      updateMapper(
        `Mode debug ON\nPoint: x=${xText}, y=${yText}\n${copyStatus}\nExemple: { id: "id", label: "Nom", answers: ["nom"], x: ${xText}, y: ${yText}, w: 8, h: 8, shape: "ellipse" }`
      );
    });

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) {
        closeOverlay();
      }
    });

    finishScreen.addEventListener("click", () => {
      finishScreen.classList.remove("active");
      finishScreen.setAttribute("aria-hidden", "true");
    });

    updateCounter();
  </script>
</body>
</html>
